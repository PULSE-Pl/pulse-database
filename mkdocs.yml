site_name: P.U.L.S.E.
site_description: Open-source international platform for infrastructure engineers
site_url: https://pulse-pl.github.io/pulse-database/
repo_url: https://github.com/pulse-pl/pulse-database
repo_name: pulse-pl/pulse-database

docs_dir: docs
site_dir: ../site

theme:
  name: material
  favicon: assets/pulse_favicon.ico
  palette:
    # Light mode
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          nav:
            - Home: README.md
            - 01. Industry Overview: 01-industry-overview/README.md
            - 02. Career Guides: 02-career-guides/README.md
            - 03. Articles & Automation: 03-articles-automation/README.md
            - Contributing Charter: CONTRIBUTING.md
        - locale: ru
          name: Русский
          build: true
          nav:
            - Главная: README.ru.md
            - Обзор отрасли: 01-industry-overview/README.ru.md
            - Гайды по карьере: 02-career-guides/README.ru.md
            - Статьи и автоматизация: 03-articles-automation/README.ru.md
            - Устав участников: CONTRIBUTING.ru.md

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - toc:
      permalink: true

copyright: Copyright &copy; 2026 P.U.L.S.E. — Public Utilities & Linear Structures Engineering


