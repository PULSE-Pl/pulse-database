site_name: P.U.L.S.E.
site_description: Open-source international platform for infrastructure engineers
site_url: https://pulse-pl.github.io/pulse-database/
repo_url: https://github.com/pulse-pl/pulse-database
repo_name: pulse-pl/pulse-database

docs_dir: docs
site_dir: ../site

theme:
  name: material
  palette:
    # Light mode palette (default)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode palette (slate)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - content.code.copy

nav:
  - Home: README.md
  - 01. Industry Overview: 01-industry-overview/README.md
  - 02. Career Guides: 02-career-guides/README.md
  - 03. Articles & Automation: 03-articles-automation/README.md
  - Contributing Charter: CONTRIBUTING.md

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - toc:
      permalink: true
